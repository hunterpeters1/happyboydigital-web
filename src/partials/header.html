<header class="site-header" id="site-header">
  <div class="container">
    <a href="/index.html" class="logo-badge"><img src="/assets/logo-smile-mark.svg" alt="" class="logo-badge-icon" aria-hidden="true"><span class="logo-badge-text">Happy Boy Digital</span></a>
    <nav class="site-nav-row" id="site-nav-links" aria-label="Primary">
{% for item in site.nav %}
      <a href="{{ item.url }}">{{ item.label }}</a>
{% endfor %}
    </nav>
    <div class="header-controls">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"><img class="toggle-art--light" src="/assets/nav-toggle-light.svg" alt="" aria-hidden="true"><img class="toggle-art--dark" src="/assets/nav-toggle-dark.svg" alt="" aria-hidden="true"></button>
      <button id="nav-toggle" class="menu-btn" type="button" aria-expanded="false" aria-controls="side-nav" aria-label="Open menu"><img src="/assets/nav-menu-icon.svg" alt="" aria-hidden="true"></button>
    </div>
  </div>
</header>
