<!DOCTYPE html>
<html lang="en">
{{ partial('head') }}
<body{% if body_class %} class="{{ body_class }}"{% endif %}>

  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Header (logo badge + toggle + menu) and slide-out side nav -->
  {{ partial('header', indent=2) }}

  <div class="nav-overlay" id="nav-overlay"></div>
  {{ partial('nav', indent=2) }}

  {{ partial('announcement', indent=2) }}

  <main id="main">
{{ main }}
  </main>

  {{ partial('footer', indent=2) }}

  <script src="{{ asset('/js/main.js') }}"></script>
{% for s in scripts %}
  <script src="{{ asset('/js/' ~ s ~ '.js') }}"></script>
{% endfor %}
</body>
</html>
