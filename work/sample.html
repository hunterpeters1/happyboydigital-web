        <div class="container">

          <div class="grid grid-2" style="gap:48px;">
            <div>
              <h2>Print Options</h2>
              <div>
                <label for="print" style="display:block; font-size:0.85rem; margin-bottom:4px;">Print size: <span style="color:var(--hbd-yellow-dark);">*</span></label>

                  <option>11 x 14 in</option>
                  <option>16 x 20 in</option>
                  
                </select>
              </div>
            </div>
            <div>

                <label for="quantity" style="display:block; font-size:0.85rem; margin-bottom:4px;">How many: <span style="color:var(--hbd-yellow-dark);">*</span></label>
                <select id="quantity" name="quantity" required style="width:100%; padding:10px; border:1px solid rgba(107,66,38,0.3); border-radius:4px; font-size:0.95rem; background:var(--hbd-beige);">
                  <option value="">Select...</option>
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                  <option>5</option>
                </select>
